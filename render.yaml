services:
  - type: web
    name: sentinelvault-backend
    env: python
    region: oregon
    plan: starter
    autoDeploy: true
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        value: "8080"
      - key: DATABASE
        value: "sentinel_fleet.db"
      - key: ENVIRONMENT
        value: "production"
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /health
