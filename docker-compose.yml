version: '3.8'

services:
  backend:
    build: .
    container_name: sentinelvault-backend
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DEBUG=False
      - PYTHONUNBUFFERED=1
    volumes:
      - ./sentinel_fleet.db:/app/sentinel_fleet.db
      - ./server.log:/app/server.log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
